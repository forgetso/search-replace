name: Cypress Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The specs import from src directly, but the extension is built too so that a failure to
      # compile is caught here rather than at release time
      - name: Build the extension
        run: npm run build

      - name: Serve the test fixtures
        run: npm run start > server.log 2>&1 &

      - name: Wait for the fixture server
        run: npx wait-on http://localhost:9000/tests/test.html --timeout 60000

      # wordpress.cy.ts is excluded by cypress.config.ts: it needs the dockerised WordPress from
      # `npm run e2e:docker:up`. Run it locally with `npm run test:e2e:wordpress`.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: src/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
